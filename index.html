<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Orbit inspection images, readings and processing times, organized by instrument and use case."><title>Orbit · Inspection gallery</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23192e40'/%3E%3Ccircle cx='20' cy='20' r='11' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M20 20L27 13' stroke='%234dd6b2' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script defer src="gallery-data.js"></script><script defer src="app.js"></script><script defer src="updates.js"></script></head>
<body>
<header><a href="index.html" class="brand" aria-label="Orbit inspection gallery"><span class="brand-icon" aria-hidden="true">O</span><span>Orbit <span class="brand-description">Inspection gallery</span></span></a></header>
<main>
<div class="demo-intro"><div><h1>Inspection showcase</h1><p>Explore visual inspection results by instrument and use case.</p></div><div class="scope-tabs" role="group" aria-label="Collection"><button id="featured" aria-pressed="false">Featured 12</button><button id="all-cases" aria-pressed="true">All cases</button></div></div><div class="toolbar"><label><span class="sr-only">Instrument type</span><select id="family"><option value="all">All instruments</option><option value="gauge">Gauges</option><option value="digital">Displays</option><option value="level">Levels</option><option value="state">Presence &amp; lights</option><option value="extra">Other</option></select></label><label class="case-control"><span class="sr-only">Use case</span><select id="case"><option value="all">All use cases</option></select></label></div>
<div class="collection-bar"><p id="collection-count">Loading images…</p><label class="search"><span class="sr-only">Find an image or use case</span><input id="search" type="search" placeholder="Find an image or use case"></label></div>
<div id="load-error" role="alert" hidden>Images could not be loaded. <button id="retry">Try again</button></div>
<div id="groups" aria-live="polite"></div><div id="empty" hidden>No images match this selection.</div>

<footer><span id="updated"></span><span>Orbit inspection gallery</span></footer>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><div><h2 id="detail-title"></h2><p id="detail-case"></p></div><button id="close" class="close" aria-label="Close image">×</button></div><div id="detail-photo" class="detail-photo"><div class="photo-frame"><img id="large-image" alt=""><svg id="reading-marks" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden></svg></div></div><div class="detail-actions"><span id="detail-time"></span><button id="marks" aria-pressed="false">Show reading marks</button><button id="zoom" aria-pressed="false">Zoom image</button></div><div id="detail-readings" class="detail-readings"></div><div class="dialog-footer"><button id="previous">← Previous</button><span id="detail-position"></span><button id="next">Next →</button></div></dialog>
</body></html>
